name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache SBT
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt') }}

      - name: Build with SBT
        run: sbt compile
        # Only Spark code (src/main/scala/spark, src/main/scala/job, etc.) is tested locally.
        # Glue-specific code (src/main/scala/glue) is not compiled or tested locally, as it requires AWS Glue libraries.

      - name: Run tests
        run: sbt test

  deploy-dev:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build assembly JAR
        run: sbt assembly

      - name: Upload JAR to S3 (dev)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp target/scala-2.12/spark-project-assembly-0.1.0.jar s3://my-dev-glue-bucket/scripts/spark-project-assembly-0.1.0.jar

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Apply (dev)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        run: |
          cd terraform
          terraform init -backend-config=env/dev/dev-backend-config.hcl
          terraform apply -auto-approve -var-file=env/dev/dev.tfvars

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build assembly JAR
        run: sbt assembly

      - name: Upload JAR to S3 (prod)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          aws s3 cp target/scala-2.12/spark-project-assembly-0.1.0.jar s3://my-prod-glue-bucket/scripts/spark-project-assembly-0.1.0.jar

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Apply (prod)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        run: |
          cd terraform
          terraform init -backend-config=env/prod/prod-backend-config.hcl
          terraform apply -auto-approve -var-file=env/prod/prod.tfvars